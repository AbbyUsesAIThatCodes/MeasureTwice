name: Deploy MeasureTwice Pages

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'src/**'
      - 'data/**'
      - 'docs/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'release.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: measuretwice-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'AbbyUsesAIThatCodes/MeasureTwice' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
    outputs:
      artifact_name: ${{ steps.build.outputs.id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Read Owner-Configured Pages Settings
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install Pinned Dependencies
        run: npx --yes pnpm@10.17.1 install --frozen-lockfile --ignore-scripts
      - name: Check Model and Build Contracts
        run: npm test
      - name: Build the Exact Main Revision
        id: build
        run: node scripts/build-pages.mjs
      - name: Validate Static Pages Output
        run: node scripts/check-pages.mjs
      - name: Upload One Pages Artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          name: ${{ steps.build.outputs.id }}
          path: ${{ steps.build.outputs.path }}
          retention-days: 1

  deploy:
    needs: build
    if: github.repository == 'AbbyUsesAIThatCodes/MeasureTwice' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the Identified Artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
