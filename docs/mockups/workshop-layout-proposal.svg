<text x="955" y="783" class="head">Can A Student See 1/16 Inch?</text>
<text x="955" y="821" class="body">1/16 in = 1.5875 mm = 0.125 world units</text>
<text x="955" y="865" class="body">Across a 100-inch view at 1366 px:</text><text x="955" y="898" class="label">Only 0.85 px per sixteenth (before perspective)</text>
<text x="955" y="940" class="body">For 6 px per sixteenth in 1000 useful pixels:</text><text x="955" y="973" class="label">Zoom to a view no wider than 10.42 inches.</text>
<text x="955" y="1019" class="body">Keyboard keeps exact graduation steps.</text><text x="955" y="1050" class="body">Magnification supports observation; precision</text><text x="955" y="1081" class="body">must not require subpixel 3D dragging.</text>
<text x="52" y="1181" class="small">Review the fixed support, realistic small-model appearance and elevated camera sightlines before any furniture changes.</text>
<text x="52" y="1210" class="small">October 14, 2026 • Proposed game dimensions, not real-workshop safety specifications • See WORKSHOP_LAYOUT_PROPOSAL.md</text>
