<title id="title">Measure Twice — Workshop Layout And Scale Proposal</title><desc id="desc">Saw front-left, tray center, examples behind tray, model front-right. Fixed 84-inch bench and 16-inch support at two world units per inch. Proposal only, no furniture has moved.</desc>
