<text x="955" y="255" class="body">Room: 12 × 10 feet, walls 8 feet high</text><text x="955" y="288" class="body">Bench: 7 × 3 feet, top 34 inches high</text>
<text x="955" y="321" class="body">Same dimensions with every instrument.</text>
<text x="955" y="368" class="label">Clear Cutting Lane</text><text x="955" y="402" class="body">Blade at x = 26 in; stock sweeps x = -13.37</text><text x="955" y="432" class="body">to 65.37 in. Model zone starts at 69 in.</text>
<text x="955" y="477" class="label">Known Tradeoff</text><text x="955" y="511" class="body">Real three-inch pieces look small in this room.</text><text x="955" y="541" class="body">Use existing focus, zoom and ruler magnifier.</text><text x="955" y="571" class="body">Uses approved focus controls; no scale switching.</text>
